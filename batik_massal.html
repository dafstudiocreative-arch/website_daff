<html>
<head>
  <title>Kirim Pesan WhatsApp Massal</title>
</head>
<body>
  <h2>Daftar Pesan WhatsApp</h2>
  <ul id="list"></ul>

  <script>
    // Data nomor dan nama toko/pemilik
    const data = [
      { nama: "Grosir Pakaian Import KL 1", nomor: "60193155700" },
      { nama: "Butik Batik KL Sentral", nomor: "60136979927" },
      { nama: "Importir Kain Wholesale 1", nomor: "60132200234" },
      { nama: "Batik Boutique/Store 1", nomor: "60193881475" },
      { nama: "Toko Kain India/Import KL", nomor: "60126759711" },
      { nama: "Pemasok Busana Muslim KL", nomor: "60172087560" },
      { nama: "Distributor Tekstil Besar", nomor: "60132223300" },
      { nama: "Toko Pakaian Borong KL 1", nomor: "601131754041" },
      { nama: "Toko Pakaian Borong KL 2", nomor: "60189888800" },
      { nama: "Wholesale Fabric Malaysia 1", nomor: "60193307767" },
      { nama: "Wholesale Fabric Malaysia 2", nomor: "60176885547" },
      { nama: "Mitra Pemasok Busana", nomor: "60172152818" },
      { nama: "Grosir Pakaian Import 2", nomor: "601127003883" },
      { nama: "Distributor Tekstil Selangor 1", nomor: "60173268812" },
      { nama: "Batik & Kraf Store", nomor: "60123592817" },
      { nama: "Importir Pakaian Muslimah S.", nomor: "601121088710" },
      { nama: "Toko Borong Kajang", nomor: "60123982880" },
      { nama: "Toko Pakaian Borong Klang", nomor: "60129780007" },
      { nama: "Grosir Kain & Baju S.", nomor: "60105315180" },
      { nama: "Distributor E-commerce (Pakaian)", nomor: "60194488998" },
      { nama: "Toko Pakaian Muslimah JB", nomor: "60137788990" },
      { nama: "Distributor Pakaian JB", nomor: "601128766779" },
      { nama: "Toko Kain Borong JB", nomor: "60136657999" },
      { nama: "Agen Pemasok Skala Kecil", nomor: "60177709800" },
      { nama: "Importir Pakaian JB", nomor: "60172087500" },
      { nama: "Toko Pakaian Borong Penang", nomor: "60124921900" },
      { nama: "Distributor Tekstil Utara", nomor: "60174205566" },
      { nama: "Batik / Kain Eksklusif", nomor: "60173669176" },
      { nama: "Pemasok Kain Muslimah", nomor: "601111663001" },
      { nama: "Pemasok Busana Import", nomor: "60193155755" },
      { nama: "Toko Borong Etnik", nomor: "60143890209" },
      { nama: "Distributor Baju Tradisional", nomor: "60135899200" },
      { nama: "Importir Tekstil Asia", nomor: "601116335111" }
    ];

    // Template pesan dengan placeholder [Store Owner / Partner]
    const templatePesan = `Subject: Exclusive Batik Shirt Collection – Special Reseller Pricing

Dear [Store Owner / Partner],

We are Daff Studio, a creative design house specializing in exclusive batik shirt collections featuring distinctive motifs not commonly found in the market.

We are pleased to offer special reseller pricing specifically for store owners and distribution partners.

You may view our complete catalog on our official website:
🔗 https://daffdesain.store/

For the latest updates and new releases, please visit our Instagram page:
📸 https://www.instagram.com/daffstudio_/

To explore our batik shirt collection directly, kindly visit:
👕 https://daffdesain.store/batik.html

We would be delighted if our designs could complement your store’s collection. Please feel free to reach out should you require further information.

Warm regards,
Daff Studio Team
https://daffdesain.store/`;

    const list = document.getElementById("list");

    data.forEach(item => {
      // Ganti placeholder dengan nama toko/pemilik
      const pesanPersonalisasi = templatePesan.replace("[Store Owner / Partner]", item.nama);

      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = `https://wa.me/${item.nomor}?text=${encodeURIComponent(pesanPersonalisasi)}`;
      link.textContent = `Kirim ke ${item.nama} (${item.nomor})`;
      link.target = "_blank";
      li.appendChild(link);
      list.appendChild(li);
    });
  </script>
</body>
</html>
